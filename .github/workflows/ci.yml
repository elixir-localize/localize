name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  LOCALIZE_DEFAULT_LOCALE: en

permissions:
  contents: read

jobs:
  # Check that R2 holds the locale data the committed hash manifest pins
  # before any test job runs. `mix test` downloads locale ETFs pinned to
  # the version in priv/localize/localize_patch_version — the same path
  # users take — and a maintainer publishes them with
  # `mix localize.publish_locales` before pushing changed data. Fork PRs
  # have no access to the R2 secrets, so they skip the check and test
  # against whatever data version is already published.
  check-locales:
    name: Check locale data
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/check-locales.yml
    secrets: inherit

  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest
    needs: check-locales
    if: ${{ !cancelled() && (needs.check-locales.result == 'success' || needs.check-locales.result == 'skipped') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every row pins the latest patch of its Elixir minor and its OTP
          # major, verified against the release tags. Bump every row that
          # uses a version in the same change, never one at a time.

          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.20"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.20"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.20"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.9"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.20"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.9"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.3"
            lint: true


    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.lint
        run: mix credo --strict

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.lint }}
        run: mix test

      - name: Run tests with coverage
        if: matrix.lint
        run: mix test --cover

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v6
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer

      - name: Check docs
        if: matrix.lint
        env:
          MIX_ENV: release
        run: mix docs --warnings-as-errors

  # The ICU NIF is optional, so the test rows above build without it and
  # every NIF test skips there. This job builds it against ICU from the
  # ICU project's own Ubuntu build (Ubuntu's ICU is too old for MF2), on
  # the lint row's toolchain, and runs the whole suite with it loaded.
  nif:
    name: "ICU NIF (ICU ${{ matrix.icu }}) / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}"
    runs-on: ubuntu-24.04
    needs: check-locales
    if: ${{ !cancelled() && (needs.check-locales.result == 'success' || needs.check-locales.result == 'skipped') }}

    strategy:
      matrix:
        include:
          - elixir: "1.20.5-otp-29"
            otp: "29.1.3"
            icu: "79.1"
            icu_url: "https://github.com/unicode-org/icu/releases/download/release-79.1/icu4c-79.1-Ubuntu24.04-x64.tgz"
            icu_sha256: "9ceb5bd2f8f876972ac2a48f6471ab10be45cf98d7d5db6d9fce055f4840e47f"

    env:
      LOCALIZE_NIF: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ICU
        run: |
          curl -fsSL -o icu.tgz "${{ matrix.icu_url }}"
          echo "${{ matrix.icu_sha256 }}  icu.tgz" | sha256sum --check
          mkdir icu && tar -xzf icu.tgz -C icu
          pc=$(find icu -name icu-uc.pc | head -1)
          prefix=$(dirname "$(dirname "$(dirname "$pc")")")
          sudo cp -a "$prefix"/. /usr/local/
          sudo ldconfig
          pkg-config --modversion icu-uc
          pkg-config --cflags --libs icu-uc icu-i18n

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-nif-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.icu }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-nif-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.icu }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with the NIF (warnings as errors)
        run: mix compile --warnings-as-errors

      # Every NIF test skips when the NIF is not loaded, so a build that
      # silently fell back to Elixir would pass. Refuse to go on.
      - name: Check the NIF is loaded
        run: |
          mix run -e 'unless Localize.Nif.available?() do raise "the ICU NIF did not load" end'

      - name: Run tests
        run: mix test

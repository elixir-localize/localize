name: Upload Inflection Data to Cloudflare R2

# Publishes the inflection data to Cloudflare R2. On push to the
# `inflection` branch it reads the data version from
# priv/localize/localize_inflection_sha (plus the pipeline revision)
# and uploads that version when it is not already on R2 — i.e. the
# version changed or was never uploaded. A push that leaves the
# version unchanged finds it already on R2 and short-circuits to a
# cheap no-op (no filter, so the never-uploaded case fires on any
# push). Also reusable from ci.yml (post-merge on main, ahead of the
# test matrix) and manually dispatchable for recovery.
#
# The conformance suites download CLDR locale data for the version in
# priv/localize/version, and this workflow never generates locale data —
# upload-locales.yml does — so that version has to be on R2 already. A run
# that finds it missing stops in under a minute and says which version to
# publish, rather than failing thirty minutes later on a 404 per locale
# inside the test step. `skip_conformance` publishes without the suites,
# for the window between a CLDR data bump and the locale upload that
# follows it.
on:
  push:
    branches: [inflection]
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_conformance:
        description: 'Publish without running the conformance suites (only when CLDR locale data for this version is not yet on R2)'
        required: false
        default: false
        type: boolean

env:
  MIX_ENV: test
  # Toolchain pins kept in step with the developer toolchain
  # (`mise current`) and with upload-locales.yml. ETF files are
  # serialized with the term_to_binary `:deterministic` option, so
  # the generated bytes are reproducible across OTP versions; the
  # pre-upload manifest check is the backstop if that ever changes.
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1"
  R2_BUCKET: content
  R2_PREFIX: inflection
  # No longer required: packed lexicons are binaries rather than
  # literals, so the conformance suite loads every supported locale
  # without bumping the literal super carrier. Retained as headroom
  # only — safe to drop. See plans/INFLECTION_LEXICON_PACKING.md.
  ELIXIR_ERL_OPTIONS: "+MIscs 3072"

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and upload inflection data
    runs-on: ubuntu-latest
    # Serialize publish runs so overlapping pushes cannot upload
    # concurrently; the queued run sees the version already on R2
    # and skips.
    concurrency:
      group: inflection-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The pin lives in priv/localize/localize_inflection_sha and the
      # pipeline revision in Localize.Inflection.Provider — both read
      # without an Elixir compile for the cheap short-circuit check.
      - name: Read data version
        id: version
        run: |
          sha=$(tr -d '[:space:]' < priv/localize/localize_inflection_sha)
          revision=$(grep -o '@data_revision [0-9]*' lib/localize/inflection/provider.ex | grep -o '[0-9]*')
          data_version="${sha:0:12}-r${revision}"
          echo "data_version=${data_version}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Data version: ${data_version}"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << RCLONE
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          RCLONE

      - name: Check if data version already exists on R2
        id: check_existing
        env:
          DATA_VERSION: ${{ steps.version.outputs.data_version }}
        run: |
          existing=$(rclone lsf "r2:${R2_BUCKET}/${R2_PREFIX}/${DATA_VERSION}/" --include "*.etf" 2>/dev/null | wc -l | tr -d '[:space:]')
          if [ "${existing}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Inflection data ${DATA_VERSION} already exists on R2 with ${existing} file(s); skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The conformance suites download CLDR locale data for the version in
      # priv/localize/version, and only en and und are in the repository.
      # This workflow generates inflection artifacts, never locale data, so
      # that version has to be on R2 already: from upload-locales.yml, which
      # generates it wherever the CLDR sources are vendored, or from a
      # maintainer machine with `mix localize.upload_locale` during a CLDR
      # beta, when priv/cldr is untracked and no runner can generate it.
      # Checked here, before the toolchain and the generate step, so a
      # missing version costs a minute rather than half an hour.
      - name: Check the CLDR locale data this version needs is published
        id: check_locales
        if: steps.check_existing.outputs.skip != 'true'
        run: |
          cldr_version=$(tr -d '[:space:]' < priv/localize/version)
          patch_raw=$(tr -d '[:space:]' < priv/localize/localize_patch_version)
          patch=${patch_raw##*:}

          case "${cldr_version}" in
            *.*.*) locale_version="${cldr_version%.*}.${patch}" ;;
            *.*) locale_version="${cldr_version}.${patch}" ;;
            *) locale_version="${cldr_version}.0.${patch}" ;;
          esac

          locale_version="v${locale_version}"
          echo "locale_version=${locale_version}" >> "$GITHUB_OUTPUT"

          # Locale data sits under its own prefix, not this workflow's
          # R2_PREFIX of "inflection".
          count=$(rclone lsf "r2:${R2_BUCKET}/locales/${locale_version}/" --include "*.etf" 2>/dev/null | wc -l | tr -d '[:space:]')

          if [ "${count}" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Locale data ${locale_version} is on R2 with ${count} file(s)."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Locale data ${locale_version} is not on R2."
          fi

      - name: Require the locale data the conformance suites download
        if: steps.check_existing.outputs.skip != 'true' && steps.check_locales.outputs.available != 'true' && inputs.skip_conformance != true
        env:
          LOCALE_VERSION: ${{ steps.check_locales.outputs.locale_version }}
        run: |
          echo "::error::CLDR locale data ${LOCALE_VERSION} is not on R2, so the inflection conformance suites cannot download the locales they format in. Publish it with 'mix localize.upload_locale', or re-run this workflow with skip_conformance to publish inflection data without the suites."
          exit 1

      - name: Set up Elixir
        if: steps.check_existing.outputs.skip != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        if: steps.check_existing.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-mix-inflection-upload-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-mix-inflection-upload-

      - name: Cache upstream inflection sources
        if: steps.check_existing.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: data/inflection
          key: inflection-source-${{ steps.version.outputs.upstream_sha }}-${{ hashFiles('data/mix/tasks/localize.inflection.download.ex') }}

      - name: Cache generated artifacts
        if: steps.check_existing.outputs.skip != 'true'
        uses: actions/cache@v6
        id: artifact-cache
        with:
          path: priv/localize/inflection
          # lexicon.ex packs the lexicon into the artifact, so a change
          # there changes the generated bytes even when nothing under
          # data/ moves; it must invalidate this cache too.
          key: inflection-artifacts-${{ steps.version.outputs.upstream_sha }}-${{ hashFiles('data/inflection_gen/**', 'data/mix/tasks/localize.inflection.*.ex', 'lib/localize/inflection/lexicon.ex') }}

      - name: Install dependencies
        if: steps.check_existing.outputs.skip != 'true'
        run: mix deps.get

      - name: Compile
        if: steps.check_existing.outputs.skip != 'true'
        run: mix compile --warnings-as-errors

      - name: Download and generate inflection data
        if: steps.check_existing.outputs.skip != 'true' && steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          mix localize.inflection.download
          mix localize.inflection.generate

      - name: Run inflection conformance suites
        if: steps.check_existing.outputs.skip != 'true' && steps.check_locales.outputs.available == 'true'
        run: mix test test/localize/inflection/

      # Reached only when the run was dispatched with skip_conformance; the
      # requirement step above stops every other run that gets this far.
      - name: Note that the conformance gate was skipped
        if: steps.check_existing.outputs.skip != 'true' && steps.check_locales.outputs.available != 'true'
        env:
          LOCALE_VERSION: ${{ steps.check_locales.outputs.locale_version }}
        run: |
          echo "::warning::Published without the inflection conformance suites: CLDR locale data ${LOCALE_VERSION} is not on R2. Run 'mix test test/localize/inflection/' locally before relying on this data."

      # The committed manifest pins the exact bytes downloads are
      # verified against. Generation is deterministic, so the bytes
      # built here must match it; if they do not, uploading would make
      # every download fail integrity verification — fail before
      # touching R2 instead. Read the committed manifest from git
      # because generation rewrites it in the working tree.
      - name: Verify generated data matches the committed hash manifest
        if: steps.check_existing.outputs.skip != 'true'
        run: |
          git show HEAD:priv/localize/inflection_hashes.etf > /tmp/committed_inflection_hashes.etf
          mix run --no-start -e '
          hashes = File.read!("/tmp/committed_inflection_hashes.etf") |> :erlang.binary_to_term()

          mismatches =
            Enum.filter(hashes, fn {file, expected} ->
              path = "priv/localize/inflection/#{file}"
              not File.exists?(path) or :crypto.hash(:sha256, File.read!(path)) != expected
            end)

          if mismatches == [] do
            IO.puts("All #{map_size(hashes)} generated files match the committed manifest.")
          else
            IO.puts("::error::Generated inflection data does not match the committed inflection_hashes.etf: #{inspect(Enum.map(mismatches, &elem(&1, 0)))}")
            IO.puts("Regenerate on the mise-current toolchain and commit the refreshed manifest.")
            System.halt(1)
          end
          '

      - name: Upload to R2
        if: steps.check_existing.outputs.skip != 'true'
        env:
          DATA_VERSION: ${{ steps.version.outputs.data_version }}
        run: |
          echo "Uploading to r2:${R2_BUCKET}/${R2_PREFIX}/${DATA_VERSION}/"
          rclone sync \
            priv/localize/inflection/ \
            "r2:${R2_BUCKET}/${R2_PREFIX}/${DATA_VERSION}/" \
            --include "*.etf" \
            --transfers 16 \
            --s3-upload-concurrency 2 \
            --stats 10s \
            --stats-one-line \
            --verbose

      - name: Skipped summary
        if: steps.check_existing.outputs.skip == 'true'
        env:
          DATA_VERSION: ${{ steps.version.outputs.data_version }}
        run: |
          echo "Skipped: inflection data ${DATA_VERSION} already present."
          echo "Bump the upstream pin or data revision in Localize.Inflection.Provider and push a new tag to trigger a real upload."
